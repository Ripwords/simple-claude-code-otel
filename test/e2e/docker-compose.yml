# A throwaway stack for end-to-end checks, so nothing is ever verified against the real Neon
# project or spends the real Upstash quota. The proxy speaks Neon's HTTP protocol in front of
# plain Postgres, and serverless-redis-http speaks Upstash's REST protocol in front of plain Redis.
name: otel-e2e

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports: ['55432:5432']
    command: ['postgres', '-c', 'wal_level=logical']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports: ['4444:4444']
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    ports: ['56379:6379']

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: e2e-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports: ['8079:80']
    depends_on: [redis]
